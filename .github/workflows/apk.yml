name: Build AlMillion APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      - run: npm install
      - run: mkdir -p www && cp index.html style.css questions.js game.js www/ && mkdir -p www/assets && cp assets/app-icon.svg www/assets/
      - run: npx cap add android && npx cap sync android
      - name: Apply Million app icon
        run: |
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density=$1
            size=$2
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/app-icon.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          rsvg-convert -w 432 -h 432 assets/app-icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#07132f</color></resources>
          EOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: almillion-quiz-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
