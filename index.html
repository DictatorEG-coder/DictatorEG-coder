<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b1b"><meta name="description" content="من سيربح المليون؟ إصدار الديكتاتور — تحدَّ معلوماتك حتى السؤال الأخير.">
<link rel="icon" type="image/svg+xml" href="assets/app-icon.svg"><title>من سيربح المليون؟ | الديكتاتور</title><link rel="stylesheet" href="style.css">
</head><body>
<main id="home" class="scr on">
<div class="brand"><img src="assets/app-icon.svg" alt="شعار الديكتاتور"><div><span>تحدّي المعلومات</span><h1>من سيربح <b>المليون</b>؟</h1><small>إصدار الديكتاتور</small></div></div>
<section class="host-card"><img src="assets/app-icon.svg" alt="الديكتاتور"><div><strong>الديكتاتور</strong><p id="hostText"></p></div></section>
<select id="cat" aria-label="تصنيف الأسئلة"></select>
<button data-m="classic">الكلاسيكي <small>15 سؤالًا حتى المليون</small></button><button data-m="quick">السريع <small>10 أسئلة</small></button><button data-m="challenge">وضع التحدي <small>أسئلة أصعب من البداية</small></button><button data-m="train">وضع التدريب <small>تدرّب دون خسارة الجائزة</small></button>
<div class="row"><button class="s" onclick="stats()">الإحصائيات</button><button class="s" onclick="show('set')">الإعدادات</button></div><p class="footnote">كل إجابة تقرّبك… وكل سؤال يكشف مستواك.</p>
</main>
<main id="game" class="scr"><div class="top"><span id="lvl"></span><span id="tm"></span><span id="pz"></span></div><div id="lad"></div>
<section class="host-mini"><img src="assets/app-icon.svg" alt=""><span id="hostLine">ركّز جيدًا.</span></section>
<div id="qc"></div><div id="qt"></div><div id="opts"></div><div id="info"></div>
<div class="row"><button id="lock" onclick="lock()">تثبيت الإجابة</button><button class="s" onclick="undo()">تراجع</button><button class="s" onclick="quit()">انسحاب</button></div>
<div class="row" id="ll"><button class="s" data-l="fifty">50:50</button><button class="s" data-l="aud">الجمهور</button><button class="s" data-l="fr">صديق</button><button class="s" data-l="skip">تغيير</button></div></main>
<main id="end" class="scr"><img class="end-emblem" src="assets/app-icon.svg" alt="شعار الديكتاتور"><h2 id="et"></h2><div id="endPrize"></div><p id="ep"></p><section class="host-card end-host"><img src="assets/app-icon.svg" alt=""><div><strong>الديكتاتور</strong><p id="endLine"></p></div></section><button onclick="show('home')">العودة إلى القائمة الرئيسية</button></main>
<main id="st" class="scr"><h2>الإحصائيات</h2><div id="sb"></div><button onclick="show('home')">رجوع</button></main>
<main id="set" class="scr"><h2>الإعدادات</h2><label><input type="checkbox" id="snd"> المؤثرات الصوتية</label><label><input type="checkbox" id="tmr"> المؤقت (45 ثانية)</label><label><input type="checkbox" id="voice"> صوت شخصية الديكتاتور (إن كان مدعومًا)</label><button class="s" onclick="reset()">إعادة ضبط الإحصائيات</button><button onclick="show('home')">رجوع</button></main>
