<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b18"><meta name="description" content="من سيربح المليون؟ — اختبر معرفتك وتدرّج نحو القمة."><link rel="icon" type="image/svg+xml" href="assets/app-icon.svg"><title>المليون | تحدّي المعرفة</title><link rel="stylesheet" href="style.css"></head><body>
<main id="home" class="scr on"><header class="brand"><img src="assets/app-icon.svg" alt="شعار المليون"><div><span class="eyebrow">اختبر حدود معرفتك</span><h1>المليون</h1><p>ليست كل الإجابات متساوية.</p></div></header>
<section class="host-card"><div class="host-orb">؟</div><div><span class="eyebrow">مقدّم المسابقة</span><strong>المقدّم</strong><p id="hostText"></p></div></section>
<section class="home-panel"><label class="section-label" for="cat">اختر مجال التحدّي</label><select id="cat" aria-label="تصنيف الأسئلة"></select><div class="mode-grid"><button class="mode-card primary" data-m="classic"><span class="mode-icon">♛</span><b>الكلاسيكي</b><small>15 سؤالًا · محاولة واحدة</small><i>ابدأ التحدي ←</i></button><button class="mode-card" data-m="quick"><span class="mode-icon">⚡</span><b>الجولة السريعة</b><small>10 أسئلة متنوعة</small></button><button class="mode-card" data-m="challenge"><span class="mode-icon">◆</span><b>التحدّي</b><small>مستوى صعب من البداية</small></button><button class="mode-card" data-m="train"><span class="mode-icon">◈</span><b>التدريب</b><small>تعلّم دون خسارة</small></button></div></section>
<div class="row"><button class="utility" onclick="stats()">الإحصائيات</button><button class="utility" onclick="show('set')">الإعدادات</button></div><p class="footnote">كل سؤال يرفع الرهان. وكل إجابة تكشف مستواك.</p></main>
<main id="game" class="scr"><div class="top"><span id="lvl"></span><span id="tm"></span><span id="pz"></span></div><div id="lad"></div><section class="host-mini"><span class="host-orb mini">؟</span><span id="hostLine">ركّز جيدًا.</span></section><div id="qc"></div><div id="qt"></div><div id="opts"></div><div id="info"></div><div class="row"><button id="lock" onclick="lock()">تأكيد الإجابة</button><button class="utility" onclick="quit()">انسحاب</button></div><div class="row" id="ll"><button class="utility" data-l="fifty">50:50</button><button class="utility" data-l="aud">الجمهور</button><button class="utility" data-l="fr">صديق</button><button class="utility" data-l="skip">تغيير السؤال</button></div></main>
<main id="end" class="scr"><div class="end-mark">✦</div><h2 id="et"></h2><div id="endPrize"></div><p id="ep"></p><section class="host-card end-host"><div class="host-orb">؟</div><div><strong>المقدّم</strong><p id="endLine"></p></div></section><button onclick="show('home')">العودة للرئيسية</button></main>
<main id="st" class="scr"><h2>الإحصائيات</h2><div id="sb"></div><button onclick="show('home')">رجوع</button></main><main id="set" class="scr"><h2>الإعدادات</h2><label><input type="checkbox" id="snd"> المؤثرات الصوتية</label><label><input type="checkbox" id="tmr"> المؤقت (45 ثانية)</label><label><input type="checkbox" id="voice"> صوت المقدّم</label><button class="utility" onclick="reset()">إعادة ضبط الإحصائيات</button><button onclick="show('home')">رجوع</button></main>
